{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Counterfeit Product Detection System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container">
      <div class="row vh-100 justify-content-center align-items-center">
        <div class="col-lg-8 text-center">
          <h1 class="fw-bold mb-4">Counterfeit Product Detection System</h1>

          <p class="text-muted mb-5">
            Please choose how you would like to enter the system.
          </p>

          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="card shadow p-4">
                <h3>User</h3>

                <p class="text-muted">Continue as a normal user.</p>

                <a href="/user/" class="btn btn-primary"> Enter as User </a>
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <div class="card shadow p-4">
                <h3>Admin</h3>

                <p class="text-muted">Continue as administrator.</p>

                <a href="{% url 'admin_login' %}" class="btn btn-dark">
                  Enter as Admin
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
